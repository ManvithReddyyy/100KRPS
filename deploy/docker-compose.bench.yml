version: '3.8'

services:
  # ── NGINX Load Balancer with SO_REUSEPORT ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    networks:
      - bench-net

  # ── Go API Replica 1 ──
  api1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://safepath:safepath@postgres:5432/safepath?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ENABLE_PPROF=true
      - FLUSH_BATCH_SIZE=1000
      - FLUSH_INTERVAL=250ms
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench-net

  # ── Go API Replica 2 ──
  api2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://safepath:safepath@postgres:5432/safepath?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ENABLE_PPROF=true
      - FLUSH_BATCH_SIZE=1000
      - FLUSH_INTERVAL=250ms
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench-net

  # ── Go API Replica 3 ──
  api3:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://safepath:safepath@postgres:5432/safepath?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ENABLE_PPROF=true
      - FLUSH_BATCH_SIZE=1000
      - FLUSH_INTERVAL=250ms
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench-net

  # ── Redis 7 (In-Memory Hot Path) ──
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --tcp-backlog 65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - bench-net

  # ── PostgreSQL 16 (Durable Historical Storage) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safepath
      POSTGRES_PASSWORD: safepath
      POSTGRES_DB: safepath
    volumes:
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c synchronous_commit=off
      -c wal_writer_delay=50ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepath -d safepath"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - bench-net

  # ── Prometheus Scraper ──
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api1
    networks:
      - bench-net

  # ── Grafana Dashboard ──
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - bench-net

networks:
  bench-net:
    driver: bridge
