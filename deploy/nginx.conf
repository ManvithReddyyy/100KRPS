# ──────────────────────────────────────────────────────────────
# SafePath Live — High-Throughput 100k RPS NGINX Configuration
# ──────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 20000;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Aggressive connection reuse
    keepalive_timeout 65;
    keepalive_requests 100000;

    # Buffer tuning
    client_body_buffer_size 16k;
    client_max_body_size 4k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Logging format optimized for throughput
    log_format bench '$status $request_time "$request" $bytes_sent';
    access_log /var/log/nginx/access.log bench buffer=64k flush=5s;

    # Upstream cluster of Go API instances with keepalive pool
    upstream api_cluster {
        least_conn;
        server api1:8081;
        server api2:8081;
        server api3:8081;

        # Keep open up to 1024 idle connections per worker to upstream Go servers
        keepalive 1024;
    }

    server {
        # SO_REUSEPORT allows multiple worker processes to bind to the same port
        # distributing incoming TCP connections directly inside the Linux kernel
        listen 80 reuseport;
        server_name _;

        # Server-Sent Events (SSE) streaming endpoint
        location ~ ^/v1/trips/[^/]+/live$ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Disable proxy buffering for instantaneous SSE frame delivery
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding off;
        }

        # Hot-path ping ingestion & REST API endpoints
        location / {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout invalid_header http_502 http_503;
        }

        # Health probe endpoint
        location /healthz {
            proxy_pass http://api_cluster/healthz;
            access_log off;
        }

        # Prometheus metrics endpoint
        location /metrics {
            proxy_pass http://api_cluster/metrics;
            access_log off;
        }
    }
}
